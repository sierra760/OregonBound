name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_public_tree.py
      - run: python -m pytest -q
  apple:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OREGON_BOUND_DATA: /tmp/oregon-bound-no-import
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate --spec OregonBound/project.yml
      - name: Test macOS
        run: >-
          xcodebuild -quiet -project OregonBound/OregonBound.xcodeproj
          -scheme OregonBound -destination 'platform=macOS'
          -derivedDataPath /tmp/oregon-bound-ci test CODE_SIGNING_ALLOWED=NO OREGON_BOUND_DATA="$OREGON_BOUND_DATA"
      - name: Build iPad
        run: >-
          xcodebuild -quiet -project OregonBound/OregonBound.xcodeproj
          -scheme OregonBound_iOS -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/oregon-bound-ipad-ci build CODE_SIGNING_ALLOWED=NO
